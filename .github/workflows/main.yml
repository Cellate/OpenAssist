name: Build APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Locate and normalize project root
      run: |
        echo "=== Checking workspace structure ==="
        pwd
        ls -la
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo "Searching for Gradle project in subdirectories..."
          SETTINGS_FILE=$(find . -mindepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Promoting nested project from $PROJECT_DIR to root..."
            cp -a "$PROJECT_DIR"/. .
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        link-to-sdk: true

    - name: Set up Android SDK and CMake
      uses: android-actions/setup-android@v3
      with:
        packages: 'cmake;3.22.1'

    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "84831b9409646a2b8e358e7b9937d65a8b1a6a4f" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
        echo "84831b9409646a2b8e358e7b9937d65a8b1a6a4f" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
        SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
        if [ -n "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "cmake;3.22.1" > /dev/null 2>&1 || true
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7
        validate-wrappers: false

    - name: Ensure debug keystore
      run: |
        mkdir -p ~/.android
        [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
          -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
          -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK
      run: |
        chmod +x ./gradlew || true
        echo "Building Debug APK..."
        if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug.log || {
            echo ""
            echo "==================== BUILD FAILURE ROOT CAUSE ===================="
            grep -A 30 "What went wrong:" build_debug.log || grep -A 25 "FAILURE:" build_debug.log || tail -n 80 build_debug.log
            echo "=================================================================="
            exit 1
          }
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build skipped, using debug APK"
        else
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug.log || {
            echo ""
            echo "==================== BUILD FAILURE ROOT CAUSE ===================="
            grep -A 30 "What went wrong:" build_debug.log || grep -A 25 "FAILURE:" build_debug.log || tail -n 80 build_debug.log
            echo "=================================================================="
            exit 1
          }
          gradle assembleRelease --no-daemon --stacktrace || echo "Release build skipped, using debug APK"
        fi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenAssist-apk
        path: |
          app/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        retention-days: 14
